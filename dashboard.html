<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyBi Hub | Command Center</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        h1 { font-family: monospace; color: var(--accent-color); }

        .btn-logout {
            padding: 8px 16px;
            background-color: #da3633;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modern Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card h3 {
            margin-bottom: 15px;
            font-family: monospace;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            color: var(--accent-color);
        }

        .profile-badge {
            display: inline-block;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SYSTEM://CYBI_FRIENDS_HUB</h1>
        <button class="btn-logout" id="logoutBtn">DISCONNECT</button>
    </header>

    <main class="dashboard-grid">
        <div class="card">
            <h3>ACTIVE_OPERATORS</h3>
            <div class="profile-card">
                <strong>B Jashuva</strong> <span class="profile-badge">Web App Sec</span>
                <p style="font-size: 0.9rem; color: #8b949e; margin-top: 5px;">Currently auditing interface layers.</p>
            </div>
        </div>

        <div class="card">
            <h3>UPCOMING_CTF_LOGS</h3>
            <p style="font-size: 0.9rem; color: #8b949e;">No deployments registered this week.</p>
        </div>

        <div class="card">
            <h3>SHARED_RESOURCES</h3>
            <ul style="padding-left: 20px; font-size: 0.9rem; line-height: 1.6;">
                <li><a href="#" style="color: var(--accent-color);">Network Packet Analysis Cheat-sheet</a></li>
                <li><a href="#" style="color: var(--accent-color);">Firebase Web Security Rules Config</a></li>
            </ul>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // CONFIG BLOCK (Must match index.html exactly)
        const firebaseConfig = {
          apiKey: "AIzaSyCac-xCRt-eUgz8YmQ4WUUi9PBY92vQIXc",
          authDomain: "blynexnews.firebaseapp.com",
          projectId: "blynexnews",
          storageBucket: "blynexnews.firebasestorage.app",
          messagingSenderId: "189868652405",
          appId: "1:189868652405:web:784c3e20a8d849d0cf053c",
          measurementId: "G-XXZ197R77F"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Security Guard Rule: Kick users back out to index.html if they aren't logged in
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            }
        });

        // Disconnect functionality
        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
