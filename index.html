<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE://DOCS_VAULT</title>
    <style>
        :root {
            --bg: #080c10;
            --surface: #121820;
            --border: #202b3c;
            --accent: #38bdf8;
            --success: #238636;
            --text: #f0f4f8;
            --text-muted: #8a99ad;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
        }

        .vault-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .search-engine {
            flex: 1;
            padding: 16px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 1.1rem;
            border-radius: 6px;
            outline: none;
        }

        .search-engine:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .add-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .add-btn:hover { filter: brightness(1.1); }

        .grid-output {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .doc-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-meta h3 { color: var(--text); font-size: 1.1rem; margin-bottom: 6px; }
        .doc-meta p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 4px; }
        
        .tag-pill {
            display: inline-block;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 2px 8px;
            font-size: 0.75rem;
            margin-top: 6px;
            border-radius: 4px;
        }

        .view-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .view-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        /* Modal Overlay Window Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            z-index: 1000;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-window {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-window h3 { margin-bottom: 20px; color: var(--accent); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; background: var(--bg);
            border: 1px solid var(--border); color: var(--text);
            border-radius: 4px; outline: none; font-family: monospace;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
        
        .cancel-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 10px 16px; border-radius: 4px; cursor: pointer; }
        .submit-btn { background: var(--accent); border: none; color: var(--bg); padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .submit-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="vault-wrapper">
        <header>
            <h2>SECURE_DOCUMENT_VAULT // AGENT_WORKSPACE</h2>
        </header>

        <div class="action-row">
            <input type="text" id="searchBox" class="search-engine" placeholder="Connecting to cloud registry synchronization loop..." disabled>
            <button class="add-btn" onclick="openModal()">+ ADD RECORD</button>
        </div>

        <main id="vaultGrid" class="grid-output"></main>
    </div>

    <div id="uploadModal" class="modal-overlay">
        <div class="modal-window">
            <h3>SECURE_REPOSITORY_PROVISION //</h3>
            <form id="uploadForm">
                <div class="form-group">
                    <label>TARGET STORAGE FILE</label>
                    <input type="file" id="fileInput" required>
                </div>
                <div class="form-group">
                    <label>CLASSIFICATION CATEGORY</label>
                    <select id="fileCategory" required>
                        <option value="Education">Education (Memos/Mksheets)</option>
                        <option value="Identification">Identification (UIDAI/PAN)</option>
                        <option value="Admission">Admission (Receipts/Allotments)</option>
                        <option value="Other">Other Miscellaneous Docs</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>OPERATIONAL DESCRIPTION</label>
                    <textarea id="fileDescription" rows="3" placeholder="Enter file tracking descriptions or contextual metadata tags..." required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">ABORT</button>
                    <button type="submit" id="submitBtn" class="submit-btn">EXECUTE UPLOAD</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // CRITICAL: WIRE UP YOUR LINKS HERE
        // ==========================================
        const BACKEND_API_URL = "https://script.google.com/macros/s/AKfycbz2l6cQkl3tTDk75GthnMQwKTxRNMYsHxz_AE8mlR-Iq_rJ5i3sBx-8gZHMvfpQyNfD/exec";
        const SHEETS_CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsEc_TZ1SB0jVoBqyRPyEeQBDx6IyKRJ71iPx0ReMWnhVoNJqEmSUhVJufc7MqKHICZPkYZIsne8iv/pub?output=csv";

        let documentInventory = [];

        // 1. Fetch data from Google Sheets CSV on load
        async function fetchDatabase() {
            if (!SHEETS_CSV_URL || SHEETS_CSV_URL.startsWith("PASTE_")) return;
            try {
                const response = await fetch(SHEETS_CSV_URL);
                const dataText = await response.text();
                parseCSV(dataText);
                
                const searchBox = document.getElementById('searchBox');
                searchBox.disabled = false;
                searchBox.placeholder = "Search by file name, category, or descriptions...";
                renderVault();
            } catch (err) {
                console.error("Fetch synced framework crash:", err);
                document.getElementById('vaultGrid').innerHTML = "<p style='color:var(--error-color)'>CRITICAL CONNECTION INTERRUPT: DATABASE REFUSED PARSING.</p>";
            }
        }

        // Lightweight safe row splitter
        function parseCSV(text) {
            const lines = text.split("\n");
            if (lines.length < 1) return;
            const headers = lines[0].split(",").map(h => h.trim().replace(/["']/g, ""));
            documentInventory = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const currentLine = lines[i].split(",");
                const obj = {};
                headers.forEach((header, idx) => {
                    let value = currentLine[idx] ? currentLine[idx].trim() : "";
                    obj[header] = value.replace(/^["']|["']$/g, ""); // Clean string bounds
                });
                documentInventory.push(obj);
            }
        }

        // Render matching vault records
        function renderVault(filterTerm = "") {
            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = "";
            const term = filterTerm.toLowerCase().trim();

            const matches = documentInventory.filter(doc => {
                return (doc.title && doc.title.toLowerCase().includes(term)) ||
                       (doc.category && doc.category.toLowerCase().includes(term)) ||
                       (doc.description && doc.description.toLowerCase().includes(term));
            });

            if (matches.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted)">NO OPERATIONAL RECORDS MATCHING SEARCH QUERY.</p>`;
                return;
            }

            matches.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'doc-card';
                card.innerHTML = `
                    <div class="doc-meta">
                        <h3>${doc.title || "Unidentified Asset"}</h3>
                        <p><strong>Tracking Registry:</strong> ${doc.id || "N/A"}</p>
                        <p><strong>Description:</strong> ${doc.description || "None"}</p>
                        <span class="tag-pill">${doc.category || "General"}</span>
                    </div>
                    <a href="${doc.driveLink}" target="_blank" class="view-btn">Pull Copy</a>
                `;
                grid.appendChild(card);
            });
        }

        // 2. Form submission and Base64 conversion logic
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "CONVERTING & TRANSMITTING...";

            const reader = new FileReader();
            reader.readAsDataURL(file); // Converts physical binary into base64 url data signature
            
            reader.onload = async function() {
                const base64String = reader.result.split(',')[1]; // Strip data descriptor header metadata
                
                const payload = {
                    fileName: file.name,
                    fileType: file.type,
                    fileCategory: document.getElementById('fileCategory').value,
                    fileDescription: document.getElementById('fileDescription').value,
                    fileBase64: base64String
                };

                try {
                    const response = await fetch(BACKEND_API_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    const resData = await response.json();

                    if (resData.status === "SUCCESS") {
                        alert("Secure sync confirmed! Row written to sheet and file deposited in Drive.");
                        closeModal();
                        document.getElementById('uploadForm').reset();
                        fetchDatabase(); // Force interface live reload sync loop
                    } else {
                        alert("Storage rejected transmission: " + resData.message);
                    }
                } catch(error) {
                    console.error(error);
                    alert("Network transport layer execution error occurred.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "EXECUTE UPLOAD";
                }
            };
        });

        // Modal triggers
        window.openModal = function() { document.getElementById('uploadModal').classList.add('active'); }
        window.closeModal = function() { document.getElementById('uploadModal').classList.remove('active'); }
        
        document.getElementById('searchBox').addEventListener('input', (e) => renderVault(e.target.value));

        // Start checking registry sync on system initialization load
        fetchDatabase();
    </script>
</body>
</html>
