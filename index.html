<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <meta http-equiv="refresh" content="0; url=https://www.amazon.com">
</head>
<body>
    <script>
        // Method 2: JavaScript Backup Redirect (Fastest browser execution)
        window.location.href = "https://www.amazon.com";
    </script>
    
    <p>If you are not redirected automatically, <a href="https://www.amazon.com">click here to go to Amazon</a>.</p>
</body>
</html>
